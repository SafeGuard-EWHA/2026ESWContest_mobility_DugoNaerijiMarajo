<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
<title id="title">SafeGuard 시스템 동작 흐름</title><desc id="desc">UWB 이탈, PIR 또는 카메라, mmWave 재실 확인, 열 예측, 팬 부저 서보 보호로 이어지는 구현 구조.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#087E83"/></marker></defs>
<rect width="1600" height="760" rx="28" fill="#F4F7FA"/>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="58" y="65" fill="#087E83" font-size="18" font-weight="700" text-anchor="start">SAFEGUARD  /  SYSTEM FLOW</text><text x="58" y="127" fill="#142E42" font-size="43" font-weight="700" text-anchor="start">보호자 이탈 감지부터 선제 보호까지</text><text x="58" y="172" fill="#526879" font-size="24" font-weight="400" text-anchor="start">필요한 단계의 처리와 판단을 순차적으로 활성화하는 Cascading Wake-up 구조</text><rect x="58" y="221" width="284" height="254" rx="20" fill="#FFFFFF" stroke="#D8E3EB"/><text x="82" y="269" fill="#087E83" font-size="24" font-weight="700" text-anchor="start">01</text><text x="82" y="323" fill="#142E42" font-size="29" font-weight="700" text-anchor="start">보호자 이탈</text><text x="82" y="375" fill="#087E83" font-size="24" font-weight="600" text-anchor="start">UWB 거리 측정</text><text x="82" y="420" fill="#526879" font-size="21" font-weight="400" text-anchor="start">5 m 초과 · 10초 유지</text><path d="M344 350 L356 350" fill="none" stroke="#087E83" stroke-width="3" marker-end="url(#arrow)"/><rect x="358" y="221" width="284" height="254" rx="20" fill="#FFFFFF" stroke="#D8E3EB"/><text x="382" y="269" fill="#087E83" font-size="24" font-weight="700" text-anchor="start">02</text><text x="382" y="323" fill="#142E42" font-size="29" font-weight="700" text-anchor="start">1차 탑승 증거</text><text x="382" y="375" fill="#087E83" font-size="24" font-weight="600" text-anchor="start">PIR 또는 카메라</text><text x="382" y="420" fill="#526879" font-size="21" font-weight="400" text-anchor="start">움직임 증거 확인</text><path d="M644 350 L656 350" fill="none" stroke="#087E83" stroke-width="3" marker-end="url(#arrow)"/><rect x="658" y="221" width="284" height="254" rx="20" fill="#FFFFFF" stroke="#D8E3EB"/><text x="682" y="269" fill="#2864AD" font-size="24" font-weight="700" text-anchor="start">03</text><text x="682" y="323" fill="#142E42" font-size="29" font-weight="700" text-anchor="start">추가 재실 확인</text><text x="682" y="375" fill="#2864AD" font-size="24" font-weight="600" text-anchor="start">60 GHz mmWave</text><text x="682" y="420" fill="#526879" font-size="21" font-weight="400" text-anchor="start">움직임이 적은 재실 확인</text><path d="M944 350 L956 350" fill="none" stroke="#087E83" stroke-width="3" marker-end="url(#arrow)"/><rect x="958" y="221" width="284" height="254" rx="20" fill="#FFFFFF" stroke="#D8E3EB"/><text x="982" y="269" fill="#BA580B" font-size="24" font-weight="700" text-anchor="start">04</text><text x="982" y="323" fill="#142E42" font-size="29" font-weight="700" text-anchor="start">열위험 예측</text><text x="982" y="375" fill="#BA580B" font-size="24" font-weight="600" text-anchor="start">실내온도 + 외기온도</text><text x="982" y="420" fill="#526879" font-size="21" font-weight="400" text-anchor="start">35°C 도달 시간 계산</text><path d="M1244 350 L1256 350" fill="none" stroke="#087E83" stroke-width="3" marker-end="url(#arrow)"/><rect x="1258" y="221" width="284" height="254" rx="20" fill="#FFFFFF" stroke="#D8E3EB"/><text x="1282" y="269" fill="#087E83" font-size="24" font-weight="700" text-anchor="start">05</text><text x="1282" y="323" fill="#142E42" font-size="29" font-weight="700" text-anchor="start">선제 보호</text><text x="1282" y="375" fill="#087E83" font-size="24" font-weight="600" text-anchor="start">팬 · 부저 · 서보</text><text x="1282" y="420" fill="#526879" font-size="21" font-weight="400" text-anchor="start">위험 온도 전 보호 요청</text><rect x="58" y="515" width="1484" height="121" rx="20" fill="#EAF3F4" stroke="#D0E5E5"/><text x="84" y="555" fill="#087E83" font-size="23" font-weight="700" text-anchor="start">입력과 보호 조건</text><text x="84" y="598" fill="#142E42" font-size="27" font-weight="600" text-anchor="start">유효한 ETA ≤ 60초 → 선제 보호   |   실측 실내온도 ≥ 35°C → 직접 보호</text><text x="58" y="684" fill="#526879" font-size="22" font-weight="400" text-anchor="start">mmWave 입력 이상 시 PIR·카메라 동시 증거를 사용하는 대체 경로와 수동 정지·재개를 포함합니다.</text><text x="58" y="726" fill="#526879" font-size="19" font-weight="400" text-anchor="start">구현 구조 설명도 · 센서 전원 차단 여부와 단계별 처리 활성화는 구분합니다.</text></g></svg>
