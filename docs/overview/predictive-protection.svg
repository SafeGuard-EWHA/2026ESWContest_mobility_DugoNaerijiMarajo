<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="750" viewBox="0 0 1600 750" role="img" aria-labelledby="title desc">
<title id="title">SafeGuard 열 예측과 선제 보호 기준</title><desc id="desc">실제 실내온도와 위치 기반 외기온도 이력 600초에서 300초 온도 곡선을 계산하고 유효한 ETA 60초 이내를 선제 보호에 사용한다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#087E83"/></marker></defs>
<rect width="1600" height="750" rx="28" fill="#F4F7FA"/>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="58" y="65" fill="#BA580B" font-size="18" font-weight="700" text-anchor="start">SAFEGUARD  /  PREDICTIVE PROTECTION</text><text x="58" y="127" fill="#142E42" font-size="41" font-weight="700" text-anchor="start">현재 온도와 위험까지 남은 시간을 함께 판단</text><text x="58" y="172" fill="#526879" font-size="24" font-weight="400" text-anchor="start">온도 이력으로 미래의 위험을 계산하고, 보호 조건에 도달하면 구동부에 요청합니다.</text><rect x="58" y="220" width="438" height="156" rx="20" fill="#FFFFFF" stroke="#D8E3EB"/><text x="84" y="264" fill="#087E83" font-size="28" font-weight="700" text-anchor="start">실내온도</text><text x="84" y="310" fill="#142E42" font-size="24" font-weight="400" text-anchor="start">차량 내부 온도 센서</text><text x="84" y="348" fill="#526879" font-size="21" font-weight="400" text-anchor="start">현재 실내온도와 변화 이력</text><rect x="530" y="220" width="438" height="156" rx="20" fill="#FFFFFF" stroke="#D8E3EB"/><text x="556" y="264" fill="#087E83" font-size="28" font-weight="700" text-anchor="start">외기온도</text><text x="556" y="310" fill="#142E42" font-size="24" font-weight="400" text-anchor="start">휴대폰 위치 기반 기상값</text><text x="556" y="348" fill="#526879" font-size="21" font-weight="400" text-anchor="start">차량 외부 열환경 입력</text><rect x="1000" y="220" width="542" height="156" rx="20" fill="#FFF4E5" stroke="#EBC89D"/><text x="1026" y="264" fill="#BA580B" font-size="28" font-weight="700" text-anchor="start">선제 보호 판단</text><text x="1026" y="310" fill="#142E42" font-size="27" font-weight="700" text-anchor="start">유효한 35°C 도달 예상 ≤ 60초</text><text x="1026" y="348" fill="#526879" font-size="20" font-weight="400" text-anchor="start">보호자 이탈·탑승자 조건·감시 상태를 함께 확인</text><rect x="58" y="422" width="1484" height="204" rx="20" fill="#FFFFFF" stroke="#D8E3EB"/><text x="84" y="467" fill="#087E83" font-size="25" font-weight="700" text-anchor="start">열 예측 계산</text><text x="84" y="509" fill="#142E42" font-size="24" font-weight="400" text-anchor="start">실내·외기온도 이력 수집</text><text x="84" y="558" fill="#087E83" font-size="40" font-weight="700" text-anchor="start">600초</text><text x="84" y="594" fill="#526879" font-size="20" font-weight="400" text-anchor="start">유효한 입력 이력</text><path d="M413 537 L485 537" fill="none" stroke="#087E83" stroke-width="3" marker-end="url(#arrow)"/><text x="525" y="509" fill="#142E42" font-size="24" font-weight="400" text-anchor="start">열수지 모델</text><text x="525" y="553" fill="#142E42" font-size="29" font-weight="600" text-anchor="start">dT/dt = (Ta − T)/τ + q</text><text x="525" y="594" fill="#526879" font-size="20" font-weight="400" text-anchor="start">문헌 시간상수 + 관측 이력 적합</text><path d="M978 537 L1040 537" fill="none" stroke="#087E83" stroke-width="3" marker-end="url(#arrow)"/><text x="1075" y="509" fill="#142E42" font-size="24" font-weight="400" text-anchor="start">예측 곡선 + 도달 예상 시간</text><text x="1075" y="558" fill="#2864AD" font-size="38" font-weight="700" text-anchor="start">향후 300초</text><text x="1075" y="594" fill="#526879" font-size="20" font-weight="400" text-anchor="start">35°C 기준과 비교</text><text x="58" y="674" fill="#142E42" font-size="24" font-weight="600" text-anchor="start">실측 실내온도가 이미 35°C 이상이면 직접 보호 조건을 적용합니다.</text><text x="58" y="716" fill="#526879" font-size="19" font-weight="400" text-anchor="start">제어 기준 설명도 · 외기온은 기상 모델 값이며, 실제 차량의 예측 정확도 평가와는 구분합니다.</text></g></svg>
