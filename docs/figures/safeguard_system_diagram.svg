<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, Helvetica, sans-serif">
<title>SafeGuard: Event-driven Cascading Wake-up System for In-vehicle Occupant Protection</title>
<desc>Technical system diagram showing a car side cutaway with sensor and actuator placement, a six-step operating sequence, the SafeGuard state machine flowchart, and the data flow pipeline from hardware/virtual sensors through analysis to the web dashboard.</desc>
