<svg width="1500" height="1080" viewBox="0 0 1500 1080" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, Helvetica, sans-serif">
<title>SafeGuard Hardware Wiring Diagram</title>
<desc>Raspberry Pi 4B를 중심으로 DHT22, PIR, Pi Camera, DWM1001-DEV UWB, SEN0609 mmWave, I2C LCD가 연결되고, DFR0473 4채널 릴레이를 통해 Fan, DC Motor, LED, Buzzer가 구동되는 SafeGuard 프로토타입 배선도.</desc>
<defs>
<marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#4A7FB8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E8863A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="0" y="0" width="1500" height="1080" fill="#FFFFFF"/>

<!-- Title -->
<text x="750" y="40" font-size="25" font-weight="700" fill="#1F2937" text-anchor="middle">SafeGuard Hardware Wiring Diagram</text>
<text x="750" y="63" font-size="14" font-weight="500" fill="#3E6FA5" text-anchor="middle">Raspberry Pi 4B 기반 센서·액추에이터 배선도</text>
<text x="750" y="83" font-size="11" fill="#6B7280" text-anchor="middle">GPIO 번호는 BCM 기준 &#183; 점선 경로는 시뮬레이션 대체 입력(simulated guardian departure input)을 의미함</text>
<line x1="60" y1="98" x2="1440" y2="98" stroke="#E5E7EB" stroke-width="1.5"/>

<!-- ================= Top row: sensor inputs ================= -->
<rect x="140" y="185" width="230" height="95" rx="6" fill="#E8F0F9" stroke="#4A7FB8" stroke-width="1"/>
<text x="255" y="212" font-size="13" font-weight="700" fill="#0C447C" text-anchor="middle">AM2302 (DHT22)</text>
<text x="255" y="230" font-size="11" fill="#375A80" text-anchor="middle">온습도 센서</text>
<text x="255" y="246" font-size="11" fill="#375A80" text-anchor="middle">Thermal RC 모델 입력</text>
<text x="255" y="264" font-size="11" fill="#375A80" text-anchor="middle">-40~80&#176;C, 0~100%RH</text>

<rect x="635" y="150" width="230" height="95" rx="6" fill="#E8F0F9" stroke="#4A7FB8" stroke-width="1"/>
<text x="750" y="177" font-size="13" font-weight="700" fill="#0C447C" text-anchor="middle">PIR DYP-ME003</text>
<text x="750" y="195" font-size="11" fill="#375A80" text-anchor="middle">적외선 모션 센서</text>
<text x="750" y="211" font-size="11" fill="#375A80" text-anchor="middle">감지거리 3~7 m</text>
<text x="750" y="227" font-size="11" fill="#375A80" text-anchor="middle">화각 120&#176;</text>

<rect x="1130" y="185" width="230" height="95" rx="6" fill="#E8F0F9" stroke="#4A7FB8" stroke-width="1"/>
<text x="1245" y="212" font-size="13" font-weight="700" fill="#0C447C" text-anchor="middle">Pi Camera V2</text>
<text x="1245" y="230" font-size="11" fill="#375A80" text-anchor="middle">CSI 카메라 모듈</text>
<text x="1245" y="246" font-size="11" fill="#375A80" text-anchor="middle">OpenCV 프레임 처리</text>
<text x="1245" y="264" font-size="11" fill="#375A80" text-anchor="middle">PIR/Camera OR 판정</text>

<!-- leaders: top row to Pi -->
<line x1="290" y1="280" x2="600" y2="465" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrowGray)"/>
<text x="330" y="365" font-size="11" fill="#374151">GPIO4</text>
<text x="330" y="379" font-size="11" fill="#374151">(+10k&#937; pull-up)</text>

<line x1="750" y1="245" x2="750" y2="465" stroke="#9CA3AF" stroke-width="1" marker-end="url(#arrowGray)"/>
<text x="762" y="365" font-size="11" fill="#374151">GPIO17</text>
<text x="762" y="379" font-size="11" fill="#374151">(Digital IN)</text>

<line x1="1210" y1="280" x2="900" y2="465" stroke="#9CA3AF" stroke-width="1" marker-end="url(#arrowGray)"/>
<text x="1010" y="365" font-size="11" fill="#374151">CSI Connector</text>
<text x="1010" y="379" font-size="11" fill="#374151">(ribbon cable)</text>

<!-- ================= Left/right: UWB, LCD, mmWave ================= -->
<rect x="140" y="430" width="230" height="95" rx="6" fill="#E8F0F9" stroke="#4A7FB8" stroke-width="1"/>
<text x="255" y="457" font-size="13" font-weight="700" fill="#0C447C" text-anchor="middle">DWM1001-DEV</text>
<text x="255" y="475" font-size="11" fill="#375A80" text-anchor="middle">UWB 모듈</text>
<text x="255" y="491" font-size="11" fill="#375A80" text-anchor="middle">simulated guardian</text>
<text x="255" y="507" font-size="11" fill="#375A80" text-anchor="middle">departure input</text>

<line x1="370" y1="477" x2="600" y2="520" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrowGray)"/>
<text x="410" y="440" font-size="11" fill="#374151">USB-UART</text>
<text x="410" y="454" font-size="11" fill="#374151">115200 bps</text>

<rect x="1130" y="430" width="230" height="90" rx="6" fill="#E8F0F9" stroke="#4A7FB8" stroke-width="1"/>
<text x="1245" y="457" font-size="13" font-weight="700" fill="#0C447C" text-anchor="middle">I2C LCD</text>
<text x="1245" y="475" font-size="11" fill="#375A80" text-anchor="middle">상태 표시</text>
<text x="1245" y="491" font-size="11" fill="#375A80" text-anchor="middle">SDA/SCL</text>

<line x1="900" y1="520" x2="1130" y2="475" stroke="#9CA3AF" stroke-width="1" marker-end="url(#arrowGray)"/>
<text x="945" y="500" font-size="11" fill="#374151">SDA(GPIO2)</text>
<text x="945" y="514" font-size="11" fill="#374151">SCL(GPIO3)</text>

<rect x="1130" y="620" width="230" height="95" rx="6" fill="#E8F0F9" stroke="#4A7FB8" stroke-width="1"/>
<text x="1245" y="647" font-size="13" font-weight="700" fill="#0C447C" text-anchor="middle">SEN0609 (C4001)</text>
<text x="1245" y="665" font-size="11" fill="#375A80" text-anchor="middle">24 GHz mmWave</text>
<text x="1245" y="681" font-size="11" fill="#375A80" text-anchor="middle">0.5~1.2 m 유효 거리</text>
<text x="1245" y="697" font-size="11" fill="#375A80" text-anchor="middle">output-level presence</text>

<line x1="900" y1="600" x2="1130" y2="660" stroke="#9CA3AF" stroke-width="1" marker-end="url(#arrowGray)"/>
<text x="945" y="620" font-size="11" fill="#374151">USB-UART 115200bps</text>
<text x="945" y="634" font-size="11" fill="#374151">I2C 0x2A (예비)</text>

<!-- ================= Raspberry Pi hub ================= -->
<rect x="600" y="465" width="300" height="180" rx="8" fill="#F1F0EA" stroke="#6B7280" stroke-width="2"/>
<text x="750" y="512" font-size="16" font-weight="700" fill="#374151" text-anchor="middle">Raspberry Pi 4B</text>
<text x="750" y="533" font-size="12" fill="#5F5E5A" text-anchor="middle">4GB RAM &#183; Raspberry Pi OS</text>
<text x="750" y="551" font-size="11" fill="#5F5E5A" text-anchor="middle">Event-driven State Machine (Python)</text>
<rect x="632" y="570" width="18" height="26" rx="2" fill="#9CA3AF"/>
<path d="M638,570 L638,562 M644,570 L644,562" stroke="#9CA3AF" stroke-width="2"/>
<text x="660" y="588" font-size="11" fill="#5F5E5A">5V / 3A USB-C 전원 입력</text>
<text x="750" y="628" font-size="10" fill="#9CA3AF" text-anchor="middle">(사용 GPIO만 표시 &#8212; 40핀 헤더 일부)</text>

<!-- ================= Relay fan-out ================= -->
<line x1="630" y1="645" x2="630" y2="745" stroke="#E8863A" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
<line x1="670" y1="645" x2="670" y2="745" stroke="#E8863A" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
<line x1="830" y1="645" x2="830" y2="745" stroke="#E8863A" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
<line x1="870" y1="645" x2="870" y2="745" stroke="#E8863A" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
<text x="1000" y="700" font-size="11" fill="#7A3E0D" text-anchor="middle">GPIO 27 / 22 / 23 / 24</text>
<text x="1000" y="716" font-size="11" fill="#7A3E0D" text-anchor="middle">(Active-Low, DFR0473 CH1&#8211;CH4)</text>

<rect x="610" y="750" width="280" height="90" rx="6" fill="#FCEEE0" stroke="#E8863A" stroke-width="1.5"/>
<text x="750" y="778" font-size="13" font-weight="700" fill="#7A3E0D" text-anchor="middle">DFR0473</text>
<text x="750" y="796" font-size="11" fill="#854F0B" text-anchor="middle">4채널 릴레이 모듈</text>
<text x="750" y="812" font-size="11" fill="#854F0B" text-anchor="middle">Active-Low 제어</text>
<text x="750" y="828" font-size="11" fill="#854F0B" text-anchor="middle">CH1: Fan &#183; CH2: DC Motor &#183; CH3: LED &#183; CH4: Buzzer</text>

<!-- actuator fan-out -->
<line x1="640" y1="840" x2="300" y2="960" stroke="#E8863A" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
<text x="440" y="905" font-size="11" fill="#7A3E0D" text-anchor="middle">CH1</text>
<line x1="690" y1="840" x2="520" y2="960" stroke="#E8863A" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
<text x="640" y="920" font-size="11" fill="#7A3E0D" text-anchor="middle">CH2</text>
<line x1="750" y1="840" x2="740" y2="960" stroke="#E8863A" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
<text x="762" y="905" font-size="11" fill="#7A3E0D" text-anchor="middle">CH3</text>
<line x1="810" y1="840" x2="960" y2="960" stroke="#E8863A" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
<text x="900" y="905" font-size="11" fill="#7A3E0D" text-anchor="middle">CH4</text>

<rect x="220" y="960" width="160" height="90" rx="6" fill="#FCEEE0" stroke="#E8863A" stroke-width="1"/>
<text x="300" y="988" font-size="13" font-weight="700" fill="#7A3E0D" text-anchor="middle">Cooling Fan</text>
<text x="300" y="1006" font-size="11" fill="#854F0B" text-anchor="middle">냉각 팬</text>
<text x="300" y="1022" font-size="11" fill="#854F0B" text-anchor="middle">CH1</text>

<rect x="440" y="960" width="160" height="90" rx="6" fill="#FCEEE0" stroke="#E8863A" stroke-width="1"/>
<text x="520" y="988" font-size="13" font-weight="700" fill="#7A3E0D" text-anchor="middle">DC Motor</text>
<text x="520" y="1006" font-size="11" fill="#854F0B" text-anchor="middle">창문 개방 모사</text>
<path d="M456,1018 L466,1023 L456,1028 Z" fill="#7A3E0D"/>
<line x1="466" y1="1015" x2="466" y2="1031" stroke="#7A3E0D" stroke-width="1.5"/>
<text x="520" y="1026" font-size="11" fill="#854F0B" text-anchor="middle">1N4007 flyback</text>

<rect x="660" y="960" width="160" height="90" rx="6" fill="#FCEEE0" stroke="#E8863A" stroke-width="1"/>
<text x="740" y="988" font-size="13" font-weight="700" fill="#7A3E0D" text-anchor="middle">Warning LED</text>
<text x="740" y="1006" font-size="11" fill="#854F0B" text-anchor="middle">경고등</text>
<path d="M678,1017 L683,1012 L688,1022 L693,1012 L698,1022 L703,1012 L708,1017" fill="none" stroke="#7A3E0D" stroke-width="1.2"/>
<text x="740" y="1026" font-size="11" fill="#854F0B" text-anchor="middle">330&#937;, 5&#966; LED</text>

<rect x="880" y="960" width="160" height="90" rx="6" fill="#FCEEE0" stroke="#E8863A" stroke-width="1"/>
<text x="960" y="988" font-size="13" font-weight="700" fill="#7A3E0D" text-anchor="middle">Buzzer</text>
<text x="960" y="1006" font-size="11" fill="#854F0B" text-anchor="middle">경고음</text>
<text x="960" y="1022" font-size="11" fill="#854F0B" text-anchor="middle">CH4</text>

<!-- Footer note -->
<line x1="60" y1="1055" x2="1440" y2="1055" stroke="#E5E7EB" stroke-width="1"/>
<text x="750" y="1072" font-size="10.5" fill="#9CA3AF" text-anchor="middle">&#8251; Actuator 전원은 Pi 5V/GND 공유 가정(프로토타입 기준) &#8212; 실제 배선에서 별도 전원 사용 시 GND 공통 연결 필요</text>

</svg>
